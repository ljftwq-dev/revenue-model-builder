[project]
name = "revenue-model-builder"
version = "0.1.0"
description = "Bottom-up revenue forecasting framework: driver-based modeling with residual alignment."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "ljftwq-dev"}]
keywords = ["revenue", "forecasting", "financial-modeling", "driver-based", "bottom-up"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.0"]
dev = ["pytest>=7"]

[project.scripts]
revenue-model = "revenue_model.__main__:main"

[project.urls]
Homepage = "https://github.com/ljftwq-dev/revenue-model-builder"
Repository = "https://github.com/ljftwq-dev/revenue-model-builder"
Documentation = "https://ljftwq-dev.github.io/revenue-model-builder/"
"Bug Tracker" = "https://github.com/ljftwq-dev/revenue-model-builder/issues"
Changelog = "https://github.com/ljftwq-dev/revenue-model-builder/releases"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["revenue_model*"]
