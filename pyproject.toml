[project]
name = "revenue-model-builder"
version = "0.17.0"
description = "Bottom-up revenue forecasting framework: driver-based modeling with residual alignment."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "ljftwq-dev"}]
keywords = ["revenue", "forecasting", "financial-modeling", "driver-based", "bottom-up"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]

dependencies = []

[project.optional-dependencies]
excel = ["openpyxl>=3.0"]
docx = ["python-docx>=1.0", "matplotlib>=3.5"]
dev = ["pytest>=7"]
viz = ["matplotlib>=3.5"]
app = ["streamlit>=1.30", "matplotlib>=3.5"]
backtest = ["statsmodels>=0.14"]
data = ["akshare>=1.14"]
scrape = ["playwright>=1.40"]
pdf = ["PyMuPDF>=1.23"]
qesa = ["pymysql>=1.0"]

[project.scripts]
revenue-model = "revenue_model.__main__:main"

[project.urls]
Homepage = "https://github.com/ljftwq-dev/revenue-model-builder"
Repository = "https://github.com/ljftwq-dev/revenue-model-builder"
Documentation = "https://ljftwq-dev.github.io/revenue-model-builder/"
"Bug Tracker" = "https://github.com/ljftwq-dev/revenue-model-builder/issues"
Changelog = "https://github.com/ljftwq-dev/revenue-model-builder/releases"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 99
target-version = "py39"

[tool.ruff.lint]
# G1 code gate: correctness signals only (pyflakes + bugbear), pinned
# explicitly so ruff's evolving defaults cannot change the ruleset.
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["B023"]
"tests/test_viz.py" = ["E402"]   # matplotlib.use("Agg") must precede pyplot imports

[tool.mypy]
# G1 type gate, scoped to the pure-stdlib kernel (network adapters excluded:
# third-party libs lack stubs and add noise, not signal)
files = [
    "revenue_model/driver.py",
    "revenue_model/segment.py",
    "revenue_model/model.py",
    "revenue_model/monte_carlo.py",
    "revenue_model/industry.py",
]
ignore_missing_imports = true
# pymysql installs without stubs on some CI pythons (import-untyped is not
# silenced by ignore_missing_imports when the package IS installed)
disable_error_code = ["import-untyped"]

[tool.setuptools.packages.find]
include = ["revenue_model*"]
